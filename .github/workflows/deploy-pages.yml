name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    environment: github-pages
    runs-on: ubuntu-latest
    env:
      CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT }}
      CONTENTFUL_CONTENT_TYPE_ID: ${{ vars.CONTENTFUL_CONTENT_TYPE_ID }}
      CONTENTFUL_PREVIEW_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_PREVIEW_ACCESS_TOKEN }}
      CONTENTFUL_DELIVERY_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_ACCESS_TOKEN }}
      CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Contentful configuration
        run: |
          if [ -z "${CONTENTFUL_PREVIEW_ACCESS_TOKEN}" ] && [ -z "${CONTENTFUL_DELIVERY_ACCESS_TOKEN}" ] && [ -z "${CONTENTFUL_ACCESS_TOKEN}" ]; then
            echo "Missing Contentful token. Set one of: CONTENTFUL_PREVIEW_ACCESS_TOKEN, CONTENTFUL_DELIVERY_ACCESS_TOKEN, CONTENTFUL_ACCESS_TOKEN."
            exit 1
          fi
          if [ -z "${CONTENTFUL_SPACE_ID}" ]; then
            echo "Missing CONTENTFUL_SPACE_ID (Actions variable in environment: github-pages)."
            exit 1
          fi
          if [ -z "${CONTENTFUL_CONTENT_TYPE_ID}" ]; then
            echo "Missing CONTENTFUL_CONTENT_TYPE_ID (Actions variable in environment: github-pages)."
            exit 1
          fi
          echo "Using Contentful space: ${CONTENTFUL_SPACE_ID}"
          echo "Using Contentful environment: ${CONTENTFUL_ENVIRONMENT:-master}"
          echo "Using Contentful content type: ${CONTENTFUL_CONTENT_TYPE_ID}"

      - name: Build static site
        run: pnpm build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
